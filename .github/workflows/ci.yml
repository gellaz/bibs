name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# runner image and bun are pinned (not `ubuntu-latest` / floating `setup-bun`)
# for reproducible CI: a silent `ubuntu-latest` image bump shifted bun's test-file
# execution order and surfaced an order-dependent mock-isolation flake (see #146).
# Mock isolation no longer depends on that order — `test:integration` now runs with
# bun's native `--isolate` (bun >=1.4) — but keep the pins so a runner or bun bump
# is a deliberate, single-place change. `--isolate` needs bun >=1.4: do not lower it.
jobs:
  lint:
    name: Lint (Biome)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # pretypecheck hooks compile Paraglide messages before tsc in each frontend.
      # TODO: add `bunx @inlang/cli validate` if message-quality gates become useful.
      - run: bun run typecheck

  api-test:
    name: API tests (unit + integration)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Integration tests spin up Postgres/PostGIS via testcontainers; Docker is preinstalled on ubuntu-24.04.
      # Env vars required by @/lib/env are injected in apps/api/tests/preload.ts, no secrets needed here.
      - run: bun run test

  web-build:
    name: Build (${{ matrix.app }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: [admin, customer, seller]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # tsc doesn't catch what only the bundler sees: SSR-only breakage (a
      # TanStack Start bump broke SSR once), DOM-only libs imported in a server
      # route, broken asset imports. VITE_API_URL has a localhost fallback, so no
      # env is needed. One job per app, so a failure names the app.
      - run: bun run build
        working-directory: apps/${{ matrix.app }}
      # The build regenerates routeTree.gen.ts (tracked): a route added without
      # committing it shows up here instead of as a confusing typecheck error.
      - name: Generated files are committed
        run: git diff --exit-code

  docker-build:
    name: Docker image (api)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Nothing else builds this Dockerfile, and it had silently broken: a
      # workspace missing from the build stage, a runtime node_modules of
      # dangling symlinks. `load` keeps the image local for the smoke test
      # below; the gha cache keeps the install layer warm.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          tags: bibs-api:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # A build alone misses what only shows at boot (EACCES on ./logs, a
      # native module that doesn't load): migrate, start the API against the
      # compose Postgres/MinIO, and require a healthy /ready. Throwaway
      # credentials, never real secrets.
      - name: Start Postgres and MinIO
        run: |
          docker compose -p smoke up -d --wait bibs-postgis bibs-minio
          cat > smoke.env <<'ENV'
          DATABASE_URL=postgres://pgadmin:P4ssword!@bibs-postgis:5432/bibs-db
          BETTER_AUTH_SECRET=ci-smoke-secret-0123456789abcdef0123
          BETTER_AUTH_URL=http://localhost:3000
          S3_ENDPOINT=http://bibs-minio:9000
          S3_ACCESS_KEY=minioadmin
          S3_SECRET_KEY=P4ssword!
          S3_BUCKET=bibs-ci
          STRIPE_SECRET_KEY=sk_test_ci_smoke
          ENV
      - name: Migrate
        run: docker run --rm --network smoke_default --env-file smoke.env bibs-api:ci bun run db:migrate
      - name: Boot and /ready
        run: |
          docker run -d --name api --network smoke_default -p 3000:3000 --env-file smoke.env bibs-api:ci
          for _ in $(seq 1 30); do
            if curl -fsS localhost:3000/ready; then exit 0; fi
            sleep 1
          done
          echo "API did not become ready" >&2
          exit 1
      - name: API logs
        if: failure()
        run: docker logs api || true
