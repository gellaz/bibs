services:
  bibs-postgis:
    build:
      context: ./docker/postgis
    container_name: bibs-postgis
    environment:
      - POSTGRES_DB=bibs-db
      - POSTGRES_USER=pgadmin
      - POSTGRES_PASSWORD=P4ssword!
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18+ images (postgres:18-trixie) place data under
      # /var/lib/postgresql/<major>/<cluster> and reject the legacy
      # /var/lib/postgresql/data mount. Mount one level up so the image
      # owns the layout. After upgrading from <18, run `bun infra:reset`
      # to recreate the volume.
      - bibs-postgis-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgadmin -d bibs-db"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  bibs-seaweedfs:
    # SeaweedFS replaces MinIO, which no longer ships community images. `mini`
    # runs master, volume, filer, S3 gateway and admin UI in one process — dev
    # only, production runs the components separately.
    image: chrislusf/seaweedfs:4.48
    container_name: bibs-seaweedfs
    command:
      - mini
      - -dir=/data
      - -s3.port=9000
      - -s3.allowedOrigins=*
      - -s3.port.iceberg=0
      - -admin.port=9001
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # admin UI
    environment:
      # `mini` turns these into the S3 admin identity.
      - AWS_ACCESS_KEY_ID=seaweedadmin
      - AWS_SECRET_ACCESS_KEY=P4ssword!
    volumes:
      - bibs-seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  bibs-mailpit:
    image: axllent/mailpit:v1.31.4
    container_name: bibs-mailpit
    ports:
      - "8025:8025" # web UI + REST API
      - "1025:1025" # SMTP (unused by our HTTP send path, exposed for future tooling)
    environment:
      # Default = auto-deleted temp file; with MP_DATABASE mail survives restarts
      # and `infra:reset` wipes it together with the DB and SeaweedFS volumes.
      - MP_DATABASE=/data/mailpit.db
    volumes:
      - bibs-mailpit-data:/data
    # The image ships with a built-in HEALTHCHECK CMD ["/mailpit", "readyz"];
    # `docker compose up --wait` honors it without extra config.

volumes:
  bibs-postgis-data:
  bibs-seaweedfs-data:
  bibs-mailpit-data:
