services:
  bibs-postgis:
    build:
      context: ./docker/postgis
    container_name: bibs-postgis
    environment:
      - POSTGRES_DB=bibs-db
      - POSTGRES_USER=pgadmin
      - POSTGRES_PASSWORD=P4ssword!
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18+ images (postgres:18-trixie) place data under
      # /var/lib/postgresql/<major>/<cluster> and reject the legacy
      # /var/lib/postgresql/data mount. Mount one level up so the image
      # owns the layout. After upgrading from <18, run `bun infra:reset`
      # to recreate the volume.
      - bibs-postgis-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgadmin -d bibs-db"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  bibs-minio:
    # MinIO stopped publishing community images: `minio/minio` is gone from
    # Docker Hub and `quay.io/minio/minio` now denies anonymous pulls. Chainguard
    # rebuilds upstream MinIO from source (same binary, same `server` CLI,
    # multi-arch, public). Its free tier only serves `latest`, so pin the digest
    # and bump it deliberately: `docker pull cgr.dev/chainguard/minio:latest`,
    # then copy the digest from `docker image inspect`. This one is
    # RELEASE.2026-09-22T19-25-18Z.
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    container_name: bibs-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=P4ssword!
      - MINIO_DOMAIN=localhost
    command:
      - server
      - --console-address=:9001
      - /data
    volumes:
      - bibs-minio-data:/data
    # Note: no healthcheck — the MinIO image ships without curl/wget/nc/mc,
    # so there's no simple in-container probe. `docker compose up --wait` treats
    # this service as ready once it reaches the "running" state, which lands a
    # beat before the port is actually bound (~60ms locally). The API's startup
    # bucket check retries connection failures to cover that window; see
    # apps/api/src/lib/retry.ts.

  bibs-mailpit:
    image: axllent/mailpit:v1.31.2
    container_name: bibs-mailpit
    ports:
      - "8025:8025" # web UI + REST API
      - "1025:1025" # SMTP (unused by our HTTP send path, exposed for future tooling)
    environment:
      # Default = auto-deleted temp file; with MP_DATABASE mail survives restarts
      # and `infra:reset` wipes it together with the DB and MinIO volumes.
      - MP_DATABASE=/data/mailpit.db
    volumes:
      - bibs-mailpit-data:/data
    # The image ships with a built-in HEALTHCHECK CMD ["/mailpit", "readyz"];
    # `docker compose up --wait` honors it without extra config.

volumes:
  bibs-postgis-data:
  bibs-minio-data:
  bibs-mailpit-data:
